<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYO KILL - Links</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
        }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen pt-16 px-5 pb-10">
    
    <!-- 
      Logo Image
      Using the absolute raw GitHub URL. This guarantees the image loads anywhere.
      Retains the CSS drop-shadow so it never clips.
    -->
    <img 
        src="https://raw.githubusercontent.com/Filoboy10/myokill_links/main/LOGO.png" 
        alt="MYO KILL Logo" 
        class="w-48 mb-8 object-contain drop-shadow-[0_10px_20px_rgba(0,0,0,0.4)]"
        onerror="this.src='https://placehold.co/400x200/transparent/black?text=MYO+KILL+LOGO'"
    >

    <!-- Main Heading -->
    <h1 class="text-[1.3rem] md:text-2xl font-bold text-black text-center mb-10 leading-snug tracking-wide max-w-sm">
        ESCANEA &bull; SÍGUENOS &bull;<br>ESCÚCHANOS
    </h1>

    <!-- Links Container -->
    <div class="w-full max-w-[360px] flex flex-col gap-3">
        
        <!-- Instagram -->
        <a 
            href="https://www.instagram.com/myokill" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="relative w-full bg-[#f4f4f4] text-[#9c2b2b] py-4 rounded-xl flex items-center justify-center text-[1.05rem] font-medium hover:bg-[#e8e8e8] transition-colors duration-200"
        >
            <span class="absolute left-5 flex items-center">
                <!-- Instagram SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </span>
            Instagram
        </a>

        <!-- Facebook -->
        <a 
            href="https://www.facebook.com/Myokill" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="relative w-full bg-[#f4f4f4] text-[#9c2b2b] py-4 rounded-xl flex items-center justify-center text-[1.05rem] font-medium hover:bg-[#e8e8e8] transition-colors duration-200"
        >
            <span class="absolute left-5 flex items-center">
                <!-- Facebook SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path>
                </svg>
            </span>
            Facebook
        </a>

        <!-- Web -->
        <a 
            href="https://myokill.com" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="relative w-full bg-[#f4f4f4] text-[#9c2b2b] py-4 rounded-xl flex items-center justify-center text-[1.05rem] font-medium hover:bg-[#e8e8e8] transition-colors duration-200"
        >
            <span class="absolute left-5 flex items-center">
                <!-- Web (Globe) SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
            </span>
            Web
        </a>

        <!-- Spotify -->
        <a 
            href="https://open.spotify.com/artist/0jNHwFOs863Bg5J3N1KFPF?si=Kq3CXOLsQ4-4llJCvjSHcA&nd=1&dlsi=e61aab83c42a415d" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="relative w-full bg-[#f4f4f4] text-[#9c2b2b] py-4 rounded-xl flex items-center justify-center text-[1.05rem] font-medium hover:bg-[#e8e8e8] transition-colors duration-200"
        >
            <span class="absolute left-5 flex items-center">
                <!-- Spotify SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.84.241 1.2zM20.16 9.6C16.32 7.32 9.48 7.08 5.52 8.28c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.56-1.32 12.12-1.08 16.56 1.56.54.3.72 1.02.42 1.56-.3.54-.96.72-1.68.3z"/>
                </svg>
            </span>
            Spotify
        </a>

        <!-- Apple Music -->
        <a 
            href="https://music.apple.com/us/album/concrete-steps-ep/1885808463" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="relative w-full bg-[#f4f4f4] text-[#9c2b2b] py-4 rounded-xl flex items-center justify-center text-[1.05rem] font-medium hover:bg-[#e8e8e8] transition-colors duration-200"
        >
            <span class="absolute left-5 flex items-center">
                <!-- Apple SVG Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="22" height="22" fill="currentColor">
                    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                </svg>
            </span>
            Apple Music
        </a>

    </div>

</body>
</html>
