<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYŌ KILL - Links</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Montserrat & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0a0a0a; /* Pitch Black */
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }

        .japanese-text {
            font-family: 'Noto Sans JP', sans-serif;
        }

        .link-btn {
            background-color: #111;
            border: 3px solid #fcfcfc;
            color: #fcfcfc;
            box-shadow: 6px 6px 0px #FF007F; /* Bubblegum Pink Shadow */
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-btn:hover {
            background-color: #FF007F;
            border-color: #FF007F;
            transform: translateY(-4px);
            box-shadow: 6px 6px 0px #fcfcfc; /* White shadow on hover */
        }
    </style>
</head>
<!-- min-h-[100dvh] y pb-24 aseguran que se pueda hacer scroll hasta abajo en cualquier celular -->
<body class="flex flex-col items-center min-h-[100dvh] pt-12 px-5 pb-24 overflow-x-hidden relative">
    
    <!-- Background Kanji (FIXED para que no bloquee el scroll) -->
    <div class="fixed top-0 left-0 w-full h-full opacity-[0.03] pointer-events-none select-none flex flex-col justify-between items-center z-0" aria-hidden="true">
        <div class="text-[10rem] md:text-[15rem] font-black japanese-text text-[#FF007F] -mt-10">ミョー</div>
        <div class="text-[10rem] md:text-[15rem] font-black japanese-text text-[#FF007F] -mb-10">キル</div>
    </div>

    <!-- Contenedor principal al frente -->
    <div class="z-10 flex flex-col items-center w-full max-w-[360px]">
        
        <!-- Logo -->
        <img 
            src="Logo_White.png" 
            alt="MYŌ KILL Logo" 
            class="w-56 mb-8 object-contain drop-shadow-[0_0_15px_rgba(255,0,127,0.4)]"
            onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/Filoboy10/myokill_links/main/MYOKILL_LOGO.png';"
        >

        <!-- Título -->
        <h1 class="text-xl md:text-2xl font-black italic text-white text-center mb-10 tracking-widest uppercase">
            ¡Síguenos y Escúchanos!
        </h1>

        <!-- Contenedor de Enlaces -->
        <div class="w-full flex flex-col gap-5">
            
            <!-- Instagram -->
            <a href="https://www.instagram.com/myokill?igsh=MW9qMTJ5Mjl0aHVxOQ==" target="_blank" rel="noopener noreferrer" class="link-btn relative w-full py-4 rounded-xl flex items-center justify-center text-lg font-black uppercase tracking-widest">
                <span class="absolute left-5 flex items-center text-2xl">
                    <i class="fa-brands fa-instagram"></i>
                </span>
                Instagram
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@myokillpr" target="_blank" rel="noopener noreferrer" class="link-btn relative w-full py-4 rounded-xl flex items-center justify-center text-lg font-black uppercase tracking-widest">
                <span class="absolute left-5 flex items-center text-2xl">
                    <i class="fa-brands fa-tiktok"></i>
                </span>
                TikTok
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1BieZpV1GV/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" class="link-btn relative w-full py-4 rounded-xl flex items-center justify-center text-lg font-black uppercase tracking-widest">
                <span class="absolute left-5 flex items-center text-2xl">
                    <i class="fa-brands fa-facebook-f"></i>
                </span>
                Facebook
            </a>

            <!-- MYOKILL.COM -->
            <a href="https://myokill.com" target="_blank" rel="noopener noreferrer" class="link-btn relative w-full py-4 rounded-xl flex items-center justify-center text-lg font-black uppercase tracking-widest">
                <span class="absolute left-5 flex items-center text-2xl">
                    <i class="fa-solid fa-globe"></i>
                </span>
                MYOKILL.COM
            </a>

            <!-- Spotify -->
            <a href="https://open.spotify.com/artist/0jNHwFOs863Bg5J3N1KFPF?si=ieCode0XRg2y5fsKQGstBw" target="_blank" rel="noopener noreferrer" class="link-btn relative w-full py-4 rounded-xl flex items-center justify-center text-lg font-black uppercase tracking-widest">
                <span class="absolute left-5 flex items-center text-2xl">
                    <i class="fa-brands fa-spotify"></i>
                </span>
                Spotify
            </a>

            <!-- Apple Music -->
            <a href="https://music.apple.com/us/album/concrete-steps-ep/1885808463" target="_blank" rel="noopener noreferrer" class="link-btn relative w-full py-4 rounded-xl flex items-center justify-center text-lg font-black uppercase tracking-widest">
                <span class="absolute left-5 flex items-center text-2xl">
                    <i class="fa-brands fa-apple"></i>
                </span>
                Apple Music
            </a>

        </div>
    </div>

</body>
</html>
