<!DOCTYPE html>
<html lang="en">
<head>

    <title>MYO KILL - Links</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
        }

</head>
<body class="flex flex-col items-center min-h-screen pt-16 px-5 pb-10">
    
    <!-- 
      Logo Image
      Updated to exactly match LOGO.JPG
    -->
    <img 
        src="LOGO.JPG" 
        alt="MYO KILL Logo" 
        class="w-48 mb-8 object-contain"

    <div class="w-full max-w-[360px] flex flex-col gap-3">
        
        <a 
            href="https://www.instagram.com/myokill" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="w-full bg-[#f4f4f4] text-[#9c2b2b] py-4 rounded-xl text-center text-[1.05rem] font-medium hover:bg-[#e8e8e8] transition-colors duration-200"

            Instagram
        </a>
